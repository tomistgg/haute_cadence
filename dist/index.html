<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071e36">
  <title>Haute Cadence · Player Cards</title>
  <style>
    @font-face { font-family: "TT Bluescreens"; src: url("assets/fonts/tt-condensed-regular.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Bluescreens"; src: url("assets/fonts/tt-bluescreens-italic.ttf") format("truetype"); font-style: italic; font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Bluescreens"; src: url("assets/fonts/tt-bluescreens-extra-bold-italic.ttf") format("truetype"); font-style: italic; font-weight: 800; font-display: swap; }
    @font-face { font-family: "Barriecito"; src: url("assets/fonts/barriecito-regular.ttf") format("truetype"); font-style: normal; font-weight: 400; font-display: swap; }
    :root { color-scheme: dark; --ink: #071e36; --mint: #42d4b4; --lime: #81da57; --purple: #440268; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; color: #f5fbff; background: radial-gradient(ellipse at 50% -15%, #1682b2 0, #0b5483 38%, #071e36 76%); font-family: Arial, sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .2; background: linear-gradient(12deg, transparent 0 36%, #dff8ef 36.15% 36.35%, transparent 36.5% 78%, #dff8ef 78.15% 78.35%, transparent 78.5%), linear-gradient(90deg, transparent 8%, #dff8ef 8.1% 8.22%, transparent 8.32% 91.6%, #dff8ef 91.7% 91.82%, transparent 91.92%); }
    button, input, select { font: inherit; }
    .page { position: relative; width: min(100% - 32px, 1120px); margin: 0 auto; padding: 26px 0 48px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 24px; }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand img { width: 58px; height: 58px; object-fit: contain; }
    .brand-name { font: 650 1.45rem/1.1 "Aptos", "Segoe UI", Arial, sans-serif; letter-spacing: -.035em; }
    .brand-kicker { margin-top: 5px; color: #a9d9e7; font: 500 .76rem/1.2 "Aptos", "Segoe UI", Arial, sans-serif; letter-spacing: .09em; text-transform: uppercase; }
    .search-wrap { position: relative; width: min(55%, 600px); }
    .search-label { display: block; margin-bottom: 8px; color: #9fe8d8; font: 400 .9rem "Barriecito", Georgia, serif; letter-spacing: .06em; text-transform: uppercase; }
    .search-box { display: flex; align-items: center; gap: 10px; border: 1px solid #5cd5bf99; border-radius: 12px; padding: 0 15px; background: #051b31e8; box-shadow: 0 12px 32px #03172b55; }
    #player-search { width: 100%; min-width: 0; border: 0; outline: 0; padding: 16px 0; color: white; background: transparent; font-size: 1.05rem; }
    #player-search::placeholder { color: #8daebd; }
    .suggestions { position: absolute; z-index: 5; top: calc(100% + 7px); right: 0; left: 0; display: none; overflow: hidden; border: 1px solid #4fc9bd88; border-radius: 12px; background: #071e36; box-shadow: 0 16px 36px #021326aa; }
    .suggestions.open { display: block; }
    .suggestion { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: 16px; border: 0; border-bottom: 1px solid #ffffff12; padding: 11px 14px; color: #effaf8; background: transparent; text-align: left; cursor: pointer; }
    .suggestion:last-child { border-bottom: 0; }
    .suggestion:hover, .suggestion[aria-selected="true"] { background: #123e58; }
    .search-hint { min-height: 1px; margin: 0; }
    .card-stage { display: grid; justify-items: center; margin-top: 22px; }
    .player-card { position: relative; container-type: inline-size; display: block; width: min(100%, 710px); aspect-ratio: 4 / 5; overflow: hidden; box-shadow: 0 24px 70px #001123a8, 0 0 0 5px #ffffff0d; }
    .card-art, .card-photo { position: absolute; display: block; }
    .card-art { inset: 0; width: 100%; height: 100%; }
    .card-photo, .card-initials { position: absolute; left: 5.42%; top: 9.72%; width: 89.17%; height: 71.39%; object-fit: cover; }
    .card-details { pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .card-name { position: absolute; left: 27%; top: 4.6%; width: 59%; height: 5%; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; color: #440268; font: italic 800 clamp(12px, 4.4cqw, 31px)/1 "TT Bluescreens", sans-serif; text-transform: uppercase; }
    .card-rank { position: absolute; left: 3.2%; top: 6.3%; width: 22%; height: 7.7%; display: flex; align-items: center; justify-content: center; font: italic 800 clamp(22px, 7cqw, 50px)/1 "TT Bluescreens", sans-serif; color: #050505; }
    .card-previous { position: absolute; left: 5.2%; top: 14%; width: 14.5%; height: 3.5%; display: flex; align-items: center; justify-content: center; white-space: nowrap; font: italic 800 clamp(7px, 1.65cqw, 12px)/1 "TT Bluescreens", sans-serif; color: #050505; }
    .card-initials { display: none; align-items: center; justify-content: center; background: #132b39; color: #b7fff0; font: italic 800 clamp(50px, 20cqw, 140px)/1 "TT Bluescreens", sans-serif; }
    .card-form, .card-title-value { position: absolute; left: 28%; width: 40%; color: #440268; font: italic 800 clamp(10px, 2.8cqw, 20px)/1 "TT Bluescreens", sans-serif; }
    .card-form { top: 87.2%; }
    .card-title-value { top: 92.8%; }
    
    @media (max-width: 720px) { .page { width: min(100% - 22px, 560px); padding-top: 16px; } .masthead { align-items: stretch; flex-direction: column; gap: 16px; margin-bottom: 16px; } .brand img { width: 46px; height: 46px; } .brand-name { font-size: 1.2rem; } .brand-kicker { font-size: .68rem; } .search-wrap { width: 100%; } .card-stage { margin-top: 14px; } }
    @font-face { font-family: "TT Bluescreens Upright"; src: url("assets/fonts/tt-bluescreens-extra-bold.ttf") format("truetype"); font-style: normal; font-weight: 800; font-display: swap; }
  </style>
  <link rel="stylesheet" href="cards.css">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div class="brand"><img src="assets/haute-cadence-logo.png" alt=""><div><div class="brand-name">Haute Cadence</div><div class="brand-kicker">Tennis player cards</div></div></div>
      <div class="card-controls">
      <div class="search-wrap">
        <label class="search-label sr-only" for="player-search">Search players</label>
        <div class="search-box"><input id="player-search" type="search" autocomplete="off" placeholder="Type a player name" role="combobox" aria-label="Search players" aria-autocomplete="list" aria-controls="player-options" aria-expanded="false"></div>
        <div class="suggestions" id="player-options" role="listbox" aria-label="Matching players"></div>
        <p class="search-hint sr-only" id="search-status" aria-live="polite"></p>
      </div>
        <label class="sr-only" for="card-type">Card type</label>
        <select id="card-type">
          <option value="form">Player Form Card</option>
          <option value="wta-125">WTA 125 Title Card</option>
          <option value="wta-tour">WTA Tour Title Card</option>
        </select>
      </div>
    </header>
    <section class="card-stage" aria-label="Selected player card">
      <div class="player-card" id="player-card" role="img" aria-labelledby="svg-title svg-description" data-type="form" hidden>
        <div class="title-event" aria-hidden="true"><strong>&#8212;</strong><span id="card-event-category">WTA 125</span></div>
        <div class="card-content">
        <span class="sr-only" id="svg-title">Haute Cadence WTA player card</span>
        <span class="sr-only" id="svg-description">A player card showing the selected tennis player's name, WTA rank, and portrait.</span>
        <img class="card-art" id="card-base" src="assets/top_100_card.png" alt="">
        <img class="card-photo" id="card-photo" alt="">
        <span class="card-initials" id="card-initials" aria-hidden="true"></span>
        <img class="card-art card-details" id="card-details" src="assets/top_100_details.png" alt="">
        <span class="card-name" id="card-name"></span>
        <div class="card-rank"><span id="card-rank"></span><sup id="card-rank-ordinal"></sup></div>
        <span class="card-previous" id="card-previous"></span>
        <span class="card-form" aria-hidden="true">&#8212;</span>
        <span class="card-title-value" aria-hidden="true">&#8212;</span>
        <span class="card-age" id="card-age"></span>
        <span class="card-country" id="card-country"></span>
        <svg class="tour-trophy" viewBox="0 0 360 220" aria-hidden="true">
          <defs><linearGradient id="trophy-gold"><stop stop-color="#b58016"/><stop offset=".45" stop-color="#ffe38b"/><stop offset="1" stop-color="#bb891e"/></linearGradient></defs>
          <path d="M65 6 H337 Q354 6 354 26 V170 Q354 188 334 188 H224 L198 215 H22 Q6 215 6 194 V80 Z" fill="url(#trophy-gold)" stroke="#111" stroke-width="4"/>
          <g fill="none" stroke="#272117" stroke-width="3"><path d="M72 42 H159 L150 101 Q145 126 115 142 Q85 126 80 101 Z M106 140 V170 H84 V192 H147 V170 H124 V140"/><path d="M75 54 H45 Q51 106 91 111 M156 54 H184 Q178 106 140 111"/></g>
          <text x="255" y="90" fill="#050505" font-family="TT Bluescreens Upright, sans-serif" font-size="58" font-weight="800" text-anchor="middle">&#8212;</text>
          <text x="255" y="157" fill="#050505" font-family="TT Bluescreens Upright, sans-serif" font-size="53" font-weight="800" text-anchor="middle">TITRE</text>
        </svg>
        <svg class="tour-laurels" viewBox="0 0 1440 1800" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="laurel-gold"><stop stop-color="#bd8d27"/><stop offset=".5" stop-color="#fff2ad"/><stop offset="1" stop-color="#d3aa43"/></linearGradient>
            <g id="laurel-left" fill="url(#laurel-gold)" stroke="#17180e" stroke-width="2.5" stroke-linejoin="round">
              <path d="M485 1715 Q160 1320 217 600 Q189 1270 510 1715 Z"/>
              <path d="M219 730 Q172 653 202 535 Q241 653 219 730 Z M215 785 Q229 649 310 553 Q285 706 215 785 Z M215 851 Q150 784 137 649 Q199 723 215 851 Z M219 921 Q248 772 350 703 Q300 848 219 921 Z M229 989 Q147 911 96 766 Q194 853 229 989 Z M242 1055 Q283 904 389 838 Q330 986 242 1055 Z M259 1125 Q153 1048 57 911 Q188 980 259 1125 Z M280 1197 Q332 1049 434 993 Q371 1138 280 1197 Z M303 1268 Q155 1199 34 1062 Q208 1131 303 1268 Z M330 1338 Q387 1193 488 1130 Q420 1287 330 1338 Z M360 1408 Q173 1345 44 1231 Q241 1275 360 1408 Z M389 1476 Q456 1342 547 1296 Q491 1430 389 1476 Z M421 1540 Q213 1490 79 1391 Q286 1424 421 1540 Z M451 1609 Q516 1499 607 1454 Q548 1579 451 1609 Z M486 1677 Q287 1647 130 1559 Q345 1571 486 1677 Z"/>
            </g>
          </defs>
          <use href="#laurel-left"/><use href="#laurel-left" transform="translate(1440 0) scale(-1 1)"/>
        </svg>
        <div class="winner-banner" aria-hidden="true"><span>VAINQUEURE</span></div>
        </div>
      </div>
    </section>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
